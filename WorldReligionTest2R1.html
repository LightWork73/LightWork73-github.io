<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Buddy</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --panel: #ffffff;
            --panel-alt: #f7f9fc;
            --panel-border: #e5ebf5;
            --text: #1d2433;
            --muted: #5d677a;
            --primary: #1f4e79;
            --primary-strong: #163b61;
            --primary-soft: #eaf6ee;
            --secondary: #6c757d;
            --success: #7fe394;
            --danger: #9f2733;
            --danger-soft: #fdeceb;
            --shadow: rgba(0,0,0,0.08);
            --button-text: #ffffff;
        }

        body.dark-mode {
            --bg: #121a26;
            --panel: #1a2434;
            --panel-alt: #212f40;
            --panel-border: #2b3d52;
            --text: #e8edf7;
            --muted: #a9b7cf;
            --primary: #7eb8f3;
            --primary-strong: #9fd0ff;
            --primary-soft: rgba(126, 184, 243, 0.14);
            --secondary: #9aa6b2;
            --success: #7ae39d;
            --danger: #ff7f8e;
            --danger-soft: rgba(255, 127, 142, 0.12);
            --shadow: rgba(0,0,0,0.3);
            --button-text: #0b1320;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            max-width: 900px;
            margin: 0 auto 50px;
            padding: 20px;
            line-height: 1.6;
            transition: background 0.2s ease, color 0.2s ease;
        }

        #top-bar {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .theme-toggle,
        .dev-toggle {
            border: 1px solid var(--panel-border);
            background: var(--panel);
            color: var(--text);
            border-radius: 999px;
            padding: 8px 14px;
            font-weight: 700;
            cursor: pointer;
        }

        #score-bar {
            position: sticky;
            top: 0;
            background: linear-gradient(135deg, #1d4f87 0%, #123a5e 100%);
            color: #f8fbff;
            padding: 16px 18px 18px;
            border-radius: 0 0 16px 16px;
            box-shadow: 0 6px 18px rgba(17, 55, 92, 0.25);
            z-index: 10;
        }

        .score-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .score-metrics {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: stretch;
        }

        .metric-box {
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            padding: 9px 12px;
            min-width: 120px;
        }

        .metric-label {
            display: block;
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            opacity: 0.9;
        }

        .metric-value {
            display: block;
            font-size: 1.15rem;
            font-weight: 800;
            margin-top: 4px;
        }

        #progress-label {
            margin-top: 12px;
            font-size: 0.9rem;
            opacity: 0.98;
            font-weight: 700;
        }

        #progress-container {
            background: rgba(255,255,255,0.18);
            border-radius: 999px;
            height: 14px;
            overflow: hidden;
            margin-top: 8px;
            border: 1px solid rgba(255,255,255,0.18);
        }

        #progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #7eea9a, #baf7c9);
            transition: width 0.3s ease;
            border-radius: 999px;
        }

        #dev-center-panel {
            display: none;
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 16px 18px;
            margin: 20px 0 18px;
            box-shadow: 0 8px 18px var(--shadow);
        }

        #dev-center-panel.open {
            display: block;
        }

        .sound-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }

        .sound-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-weight: 600;
            color: var(--text);
        }

        .sound-field select {
            width: 100%;
            border: 1px solid var(--panel-border);
            background: var(--panel-alt);
            color: var(--text);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 0.96rem;
        }

        .sound-preview-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 16px;
        }

        .sound-preview-btn {
            background: var(--primary);
            color: var(--button-text);
            border: none;
            border-radius: 8px;
            padding: 9px 14px;
            cursor: pointer;
            font-weight: 700;
        }

        .question-card {
            background: var(--panel);
            padding: 28px 24px;
            margin: 24px 0;
            border-radius: 14px;
            box-shadow: 0 2px 10px var(--shadow);
            border-left: 10px solid var(--primary);
        }

        .section-title {
            margin: 28px 0 10px;
            color: var(--primary);
            font-size: 1.6rem;
        }

        .source-tag {
            display: inline-block;
            background: #eaf3ff;
            color: #0f4c81;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 0.02em;
        }

        body.dark-mode .source-tag {
            background: rgba(126, 184, 243, 0.14);
            color: #bfe1ff;
        }

        .reference-text {
            margin: 8px 0 14px;
            padding: 8px 10px;
            background: var(--panel-alt);
            border-left: 4px solid #2b6cb0;
            border-radius: 8px;
            color: var(--text);
            font-size: 13px;
            font-weight: 600;
        }

        .option-label {
            display: block;
            padding: 12px 14px;
            margin: 10px 0;
            background: var(--panel-alt);
            border: 2px solid var(--panel-border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-label:hover {
            background: var(--primary-soft);
            border-color: var(--primary);
        }

        .check-btn {
            background: var(--primary);
            color: var(--button-text);
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            margin-top: 14px;
        }

        .check-btn:disabled {
            background: #b7c2d1;
            cursor: not-allowed;
        }

        .feedback {
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 8px;
            display: none;
            font-weight: 600;
        }

        .correct {
            background: var(--primary-soft);
            color: var(--primary-strong);
            border: 1px solid var(--primary);
        }

        .wrong {
            background: var(--danger-soft);
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        details {
            margin-top: 14px;
            border-top: 1px solid var(--panel-border);
            padding-top: 10px;
        }

        summary {
            cursor: pointer;
            color: var(--muted);
            font-weight: 700;
        }

        .hint-text {
            color: var(--muted);
            font-style: italic;
            padding-top: 8px;
        }

        #results-card {
            display: none;
            background: var(--panel);
            padding: 32px 24px;
            text-align: center;
            border-radius: 14px;
            box-shadow: 0 4px 20px var(--shadow);
            border: 2px solid var(--primary);
            margin-top: 30px;
        }

        .reset-btn {
            background: #2f9e44;
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 12px;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            #score-bar {
                padding: 12px 12px 14px;
            }

            .score-row {
                align-items: flex-start;
            }

            .score-metrics {
                width: 100%;
                gap: 8px;
            }

            .metric-box {
                flex: 1 1 42%;
                min-width: 0;
            }

            .reset-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div id="top-bar">
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">🌙 Dark mode</button>
        <button class="dev-toggle" id="dev-center-toggle" type="button" aria-label="Open developer sound center" aria-expanded="false" title="Developer sound center">⚙️ Dev Center</button>
    </div>

    <div id="score-bar">
        <div class="score-row">
            <div class="score-metrics">
                <div class="metric-box">
                    <span class="metric-label">Score</span>
                    <span class="metric-value"><span id="current-score">0</span> / <span id="total-q-count">0</span></span>
                </div>
                <div class="metric-box">
                    <span class="metric-label">Accuracy</span>
                    <span class="metric-value"><span id="score-percent">0</span>%</span>
                </div>
            </div>
            <button class="reset-btn" type="button" onclick="resetQuiz()">Try Again</button>
        </div>
        <div id="progress-label">Progress: <span id="answered-count">0</span> / <span id="answered-total">0</span> answered</div>
        <div id="progress-container"><div id="progress-fill"></div></div>
    </div>

    <div id="dev-center-panel">
        <h3>Developer Sound Center</h3>
        <div class="sound-grid">
            <label class="sound-field">
                Correct answer
                <select id="sound-correct-select">
                    <option value="retro">Retro Nintendo</option>
                    <option value="arcade">Arcade Win</option>
                    <option value="cash">Cash Register</option>
                    <option value="coin">Coin Drop</option>
                    <option value="soft">Soft Chime</option>
                    <option value="bell">Big Bell</option>
                </select>
            </label>
            <label class="sound-field">
                Wrong answer
                <select id="sound-wrong-select">
                    <option value="retro">Retro Buzz</option>
                    <option value="arcade">Arcade Error</option>
                    <option value="cash">Low Thud</option>
                    <option value="coin">Soft Drop</option>
                    <option value="soft">Short Beep</option>
                    <option value="bell">Alert Tone</option>
                </select>
            </label>
            <label class="sound-field">
                Finish sound
                <select id="sound-finish-select">
                    <option value="retro">Retro Clear</option>
                    <option value="arcade">Arcade Victory</option>
                    <option value="cash">Cash Register Finish</option>
                    <option value="coin">Coin Rain</option>
                    <option value="soft">Happy Chime</option>
                    <option value="bell">Big Celebration</option>

            </label>
        </div>
        <div class="sound-preview-row">
            <button class="sound-preview-btn" type="button" data-sound="correct">Preview Correct</button>
            <button class="sound-preview-btn" type="button" data-sound="wrong">Preview Wrong</button>
            <button class="sound-preview-btn" type="button" data-sound="finish">Preview Finish</button>
        </div>
    </div>

    <div id="quiz-root"></div>

    <div id="results-card">
        <h2>Quiz Complete!</h2>
        <p id="result-text" style="font-size: 24px; font-weight: bold;"></p>
        <p id="result-comment"></p>
        <button class="reset-btn" onclick="resetQuiz()">Retake Quiz</button>
    </div>

    <script>
        const soundChoices = {
            correct: 'retro',
            wrong: 'retro',
            finish: 'retro'
        };

        let audioCtx = null;

        function getAudioContext() {
            const AudioCtor = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtor) return null;
            if (!audioCtx) audioCtx = new AudioCtor();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playTone(frequency, duration, { type = 'sine', volume = 0.06, slideTo = null } = {}) {
            const ctx = getAudioContext();
            if (!ctx) return;

            const oscillator = ctx.createOscillator();
            const gainNode = ctx.createGain();
            oscillator.type = type;
            oscillator.frequency.setValueAtTime(frequency, ctx.currentTime);

            if (slideTo) {
                oscillator.frequency.exponentialRampToValueAtTime(slideTo, ctx.currentTime + duration);
            }

            gainNode.gain.setValueAtTime(0.0001, ctx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(volume, ctx.currentTime + 0.02);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);

            oscillator.connect(gainNode);
            gainNode.connect(ctx.destination);
            oscillator.start();
            oscillator.stop(ctx.currentTime + duration);
        }

        const soundPresets = {
            retro: {
                correct: () => {
                    const notes = [659.25, 783.99, 987.77, 1046.5];
                    notes.forEach((note, index) => {
                        setTimeout(() => playTone(note, 0.09, { type: 'square', volume: 0.04, slideTo: note * 1.06 }), index * 90);
                    });
                },
                wrong: () => playTone(210, 0.16, { type: 'sawtooth', volume: 0.05, slideTo: 120 }),
                finish: () => {
                    const notes = [523.25, 659.25, 783.99, 1046.5, 1046.5, 1174.66, 1318.51];
                    const durations = [0.26, 0.22, 0.22, 0.22, 0.26, 0.34, 0.42];
                    notes.forEach((note, index) => {
                        setTimeout(() => playTone(note, durations[index], { type: 'triangle', volume: 0.06, slideTo: note * 1.08 }), index * 140);
                    });
                }
            },
            arcade: {
                correct: () => {
                    playTone(660, 0.08, { type: 'square', volume: 0.04, slideTo: 820 });
                    setTimeout(() => playTone(880, 0.09, { type: 'square', volume: 0.04, slideTo: 1040 }), 70);
                    setTimeout(() => playTone(1100, 0.12, { type: 'triangle', volume: 0.03, slideTo: 1260 }), 140);
                },
                wrong: () => playTone(240, 0.18, { type: 'square', volume: 0.04, slideTo: 120 }),
                finish: () => {
                    const notes = [392, 523.25, 659.25, 783.99, 783.99];
                    notes.forEach((note, index) => {
                        const duration = index === notes.length - 1 ? 0.34 : 0.2;
                        setTimeout(() => playTone(note, duration, { type: 'triangle', volume: 0.06, slideTo: note * 1.08 }), index * 150);
                    });
                }
            },
            cash: {
                correct: () => {
                    playTone(1200, 0.04, { type: 'square', volume: 0.04, slideTo: 1500 });
                    setTimeout(() => playTone(1600, 0.06, { type: 'triangle', volume: 0.03, slideTo: 1800 }), 40);
                    setTimeout(() => playTone(180, 0.12, { type: 'sine', volume: 0.04, slideTo: 90 }), 70);
                },
                wrong: () => playTone(170, 0.2, { type: 'sawtooth', volume: 0.04, slideTo: 80 }),
                finish: () => {
                    const notes = [440, 587.33, 659.25, 880, 880];
                    notes.forEach((note, index) => {
                        const duration = index === notes.length - 1 ? 0.32 : 0.18;
                        setTimeout(() => playTone(note, duration, { type: 'triangle', volume: 0.06, slideTo: note * 1.1 }), index * 160);
                    });
                }
            },
            coin: {
                correct: () => {
                    playTone(880, 0.05, { type: 'triangle', volume: 0.04, slideTo: 1100 });
                    setTimeout(() => playTone(150, 0.18, { type: 'sine', volume: 0.05, slideTo: 70 }), 45);
                    setTimeout(() => playTone(220, 0.1, { type: 'triangle', volume: 0.04, slideTo: 190 }), 95);
                },
                wrong: () => playTone(200, 0.18, { type: 'triangle', volume: 0.04, slideTo: 110 }),
                finish: () => {
                    const notes = [392, 440, 523.25, 659.25, 783.99, 783.99];
                    notes.forEach((note, index) => {
                        const duration = index === notes.length - 1 ? 0.28 : 0.16;
                        setTimeout(() => playTone(note, duration, { type: 'sine', volume: 0.06, slideTo: note * 1.07 }), index * 120);
                    });
                }
            },
            soft: {
                correct: () => {
                    playTone(740, 0.12, { type: 'triangle', volume: 0.03, slideTo: 900 });
                    setTimeout(() => playTone(960, 0.1, { type: 'triangle', volume: 0.025, slideTo: 1100 }), 80);
                },
                wrong: () => playTone(260, 0.14, { type: 'sine', volume: 0.03, slideTo: 180 }),
                finish: () => {
                    const notes = [523.25, 659.25, 783.99, 783.99];
                    notes.forEach((note, index) => {
                        const duration = index === notes.length - 1 ? 0.3 : 0.2;
                        setTimeout(() => playTone(note, duration, { type: 'triangle', volume: 0.05, slideTo: note * 1.05 }), index * 150);
                    });
                }
            },
            bell: {
                correct: () => {
                    playTone(784, 0.18, { type: 'sine', volume: 0.06, slideTo: 980 });
                    setTimeout(() => playTone(1174, 0.16, { type: 'sine', volume: 0.05, slideTo: 1340 }), 90);
                },
                wrong: () => playTone(300, 0.22, { type: 'square', volume: 0.05, slideTo: 180 }),
                finish: () => {
                    const notes = [392, 523.25, 659.25, 783.99, 1046.5, 1046.5];
                    notes.forEach((note, index) => {
                        const duration = index === notes.length - 1 ? 0.36 : 0.2;
                        setTimeout(() => playTone(note, duration, { type: 'triangle', volume: 0.06, slideTo: note * 1.08 }), index * 140);
                    });
                }
            }
        };

        function playSelectedSound(kind) {
            const presetName = soundChoices[kind];
            const preset = soundPresets[presetName];
            if (preset && preset[kind]) preset[kind]();
        }

        function toggleTheme() {
            const body = document.body;
            const darkMode = body.classList.toggle('dark-mode');
            document.querySelector('.theme-toggle').textContent = darkMode ? '☀️ Light mode' : '🌙 Dark mode';
            localStorage.setItem('theme', darkMode ? 'dark' : 'light');
        }

        let currentSectionIndex = 0;
        let totalScore = 0;
        let answeredQuestions = new Set();

        function renderQuiz() {
            const root = document.getElementById('quiz-root');
            root.innerHTML = '';

            const activeSection = studySections[currentSectionIndex];
            const sectionBlock = document.createElement('div');
            sectionBlock.className = 'section-block';

            const heading = document.createElement('h2');
            heading.className = 'section-title';
            heading.textContent = activeSection.title;
            sectionBlock.appendChild(heading);

            activeSection.questions.forEach((item, qIndex) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `card-${qIndex}`;

                let content = `
                    <div class="source-tag">${item.source}</div>
                    <div class="reference-text"><strong>Reference:</strong> ${item.source}</div>
                    <h3>Question ${qIndex + 1}</h3>
                    <p>${item.q}</p>
                `;

                item.options.forEach((opt, optIdx) => {
                    const inputType = item.type === 'multi' ? 'checkbox' : 'radio';
                    content += `
                        <label class="option-label">
                            <input type="${inputType}" name="q${qIndex}" value="${optIdx}">
                            ${opt}
                        </label>
                    `;
                });

                content += `<button class="check-btn" id="btn-${qIndex}" onclick="verify(${qIndex})">Check Answer</button>`;
                content += `<div id="fb-${qIndex}" class="feedback"></div>`;
                content += `
                    <details>
                        <summary>Show Hint</summary>
                        <div class="hint-text">${item.hint}</div>
                    </details>
                `;

                card.innerHTML = content;
                sectionBlock.appendChild(card);
            });

            root.appendChild(sectionBlock);

            document.getElementById('total-q-count').textContent = activeSection.questions.length;
            document.getElementById('answered-total').textContent = activeSection.questions.length;
            updateUI();
        }

        function updateUI() {
            const currentQuestionCount = studySections[currentSectionIndex].questions.length;
            const answeredCount = answeredQuestions.size;
            document.getElementById('current-score').textContent = totalScore;
            document.getElementById('answered-count').textContent = answeredCount;
            document.getElementById('answered-total').textContent = currentQuestionCount;
            document.getElementById('score-percent').textContent = answeredCount === 0 ? '0' : Math.round((totalScore / answeredCount) * 100);
            const progress = (answeredCount / currentQuestionCount) * 100;
            document.getElementById('progress-fill').style.width = progress + '%';

            if (answeredCount === currentQuestionCount) {
                showFinalResults();
            }
        }

        window.verify = function(idx) {
            const item = studySections[currentSectionIndex].questions[idx];
            const inputs = Array.from(document.querySelectorAll(`input[name="q${idx}"]:checked`));
            const selected = inputs.map((el) => parseInt(el.value, 10));
            const feedback = document.getElementById(`fb-${idx}`);

            if (selected.length === 0) return;

            const isCorrect = selected.length === item.correct.length && selected.every((value) => item.correct.includes(value));

            feedback.style.display = 'block';
            if (isCorrect) {
                feedback.innerHTML = '✅ Correct!';
                feedback.className = 'feedback correct';
                if (!answeredQuestions.has(idx)) {
                    totalScore += 1;
                    answeredQuestions.add(idx);
                }
                playSelectedSound('correct');
            } else {
                feedback.innerHTML = `❌ Incorrect. Correct answer: ${item.correct.map((c) => item.options[c]).join(' & ')}`;
                feedback.className = 'feedback wrong';
                answeredQuestions.add(idx);
                playSelectedSound('wrong');
            }

            document.getElementById(`btn-${idx}`).disabled = true;
            document.querySelectorAll(`input[name="q${idx}"]`).forEach((el) => {
                el.disabled = true;
            });
            updateUI();
        }

        function showFinalResults() {
            const totalQuestions = studySections[currentSectionIndex].questions.length;
            const percentage = Math.round((totalScore / totalQuestions) * 100);
            const resultText = document.getElementById('result-text');
            const resultComment = document.getElementById('result-comment');
            const resultsCard = document.getElementById('results-card');

            resultsCard.style.display = 'block';
            resultText.innerText = `Final Score: ${totalScore} / ${totalQuestions} (${percentage}%)`;

            if (percentage >= 85) {
                resultComment.innerText = 'Strong work. You are covering the main ideas well.';
            } else if (percentage >= 70) {
                resultComment.innerText = 'Good progress. Review the missed questions and keep practicing.';
            } else {
                resultComment.innerText = 'This is a good first pass. Go back through the hints and try again.';
            }

            playSelectedSound('finish');
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        const soundSelects = {
            correct: document.getElementById('sound-correct-select'),
            wrong: document.getElementById('sound-wrong-select'),
            finish: document.getElementById('sound-finish-select')
        };

        Object.entries(soundSelects).forEach(([kind, selectEl]) => {
            selectEl.addEventListener('change', (event) => {
                soundChoices[kind] = event.target.value;
            });
        });

        document.querySelectorAll('.sound-preview-btn').forEach((button) => {
            button.addEventListener('click', () => playSelectedSound(button.dataset.sound));
        });

        const devCenterToggle = document.getElementById('dev-center-toggle');
        const devCenterPanel = document.getElementById('dev-center-panel');

        devCenterToggle.addEventListener('click', () => {
            const isOpen = devCenterPanel.classList.toggle('open');
            devCenterToggle.setAttribute('aria-expanded', String(isOpen));
            devCenterToggle.title = isOpen ? 'Close developer sound center' : 'Open developer sound center';
        });

        window.resetQuiz = function() {
            currentSectionIndex = (currentSectionIndex + 1) % studySections.length;
            totalScore = 0;
            answeredQuestions.clear();
            document.getElementById('results-card').style.display = 'none';
            document.getElementById('progress-fill').style.width = '0%';
            document.getElementById('current-score').textContent = '0';
            document.getElementById('score-percent').textContent = '0';
            document.getElementById('answered-count').textContent = '0';
            renderQuiz();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.addEventListener('load', () => {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
                document.querySelector('.theme-toggle').textContent = '☀️ Light mode';
            }
        });

        renderQuiz();
    </script>
