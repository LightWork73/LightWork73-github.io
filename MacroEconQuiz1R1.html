            font-size: 16px;

            display: inline-block;

            background: #6c757d;
            color: white;

            card.innerHTML = html;
            root.appendChild(card);

            const selected = Array.from(document.querySelectorAll(`input[name="q${idx}"]:checked`)).map(el => Number(el.value));
            if (!selected.length) {
                alert('Please choose an answer before checking.');
                return;
            }

            const isCorrect = selected.length === item.correct.length && selected.every(value => item.correct.includes(value));
            const fb = document.getElementById(`fb-${idx}`);
            fb.style.display = 'block';

            if (isCorrect) {
                fb.className = 'feedback correct';
                fb.textContent = '✅ Correct!';
                score++;
            } else {
                fb.className = 'feedback wrong';
                fb.textContent = `❌ Incorrect. Correct answer: ${item.correct.map(i => item.options[i]).join(', ')}`;
            }

            document.querySelectorAll(`input[name="q${idx}"]`).forEach(el => el.disabled = true);
            document.querySelectorAll(`.check-btn`)[idx].disabled = true;
            answered++;
            document.getElementById('current-score').textContent = score;
            document.getElementById('progress-fill').style.width = `${(answered / quizData.length) * 100}%`;
        };
    </script>
</body>
</html>
