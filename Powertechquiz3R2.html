<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EETC-2311 Verbatim Study Tool</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; color: #333; max-width: 850px; margin: 0 auto 50px auto; padding: 20px; line-height: 1.6; }
        #score-bar { position: sticky; top: 0; background: #2c3e50; color: white; padding: 15px; text-align: center; z-index: 1000; border-radius: 0 0 10px 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        #progress-container { background: #ecf0f1; border-radius: 5px; height: 10px; margin-top: 10px; }
        #progress-fill { width: 0%; height: 100%; background: #27ae60; border-radius: 5px; transition: width 0.3s; }
        .question-card { background: white; padding: 25px; margin: 25px 0; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-left: 8px solid #3498db; }
        .q-img { max-width: 100%; height: auto; margin: 15px 0; border: 2px solid #ddd; border-radius: 8px; display: block; }
        .img-placeholder { background: #e9ecef; padding: 20px; border: 2px dashed #adb5bd; color: #495057; text-align: center; border-radius: 8px; margin: 10px 0; }
        .option-label { display: block; padding: 12px; margin: 8px 0; background: #f8f9fa; border: 2px solid #eee; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .option-label:hover { background: #eef7ff; border-color: #3498db; }
        .check-btn { background: #27ae60; color: white; border: none; padding: 12px 25px; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .feedback { margin-top: 15px; padding: 15px; border-radius: 5px; display: none; font-weight: bold; }
        .correct { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .wrong { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        summary { cursor: pointer; color: #3498db; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div id="score-bar">
    <strong>Verbatim Score: <span id="current-score">0</span> / 46</strong>
    <div id="progress-container"><div id="progress-fill"></div></div>
</div>

<div id="quiz-root"></div>

<script>
    const quizData = [
        { q: "1. What are the two largest power production sources in the United States?", type: "multi", options: ["Fossil", "Solar", "Hydro", "Wind", "Nuclear"], correct: [0, 4], hint: "Think: Fossil and Nuclear.", explanation: "Nuclear and Fossil" },
        { q: "2. What is the largest producer of clean power in the United States? (Clean = Low CO2 production)", type: "single", options: ["Wind", "Solar", "Hydro", "Nuclear"], correct: [3], hint: "Nuclear provides massive carbon-free base load." },
        { q: "3. Which fossil fuel is used with a Combustion Turbine for power generation?", type: "single", options: ["Lignite", "Natural Gas", "Coal", "None of the answers listed"], correct: [1], hint: "It's the gaseous one." },
        { q: "4. What are the two factors are required to produce hydro power?", type: "multi", options: ["None of the answers listed", "Flow Velocity", "Area of Lake", "Hydrostatic Head"], correct: [1, 3], hint: "Head and Velocity.", explanation: "Hydrostatic head and Flow velocity" },
        { q: "5. Identify prime movers listed that are used to generate electricity.", type: "multi", options: ["Gas Engine", "Hydro-turbine", "Wind-Turbine", "Combustion Turbine", "Steam Turbine", "Diesel Engine"], correct: [0,1,2,3,4,5], hint: "They are all valid prime movers." },
        { q: "6. Identify the type of power plant equipment shown in the image.", type: "single", img: "q6.png", options: ["Condenser", "Wind turbine", "Combustion Turbine", "Nuclear Reactor", "Steam Generator"], correct: [2], hint: "Used with gas." },
        { q: "7. Identify the power plant shown", type: "single", img: "q7.png", options: ["Combustion Turbine", "Diesel Generator", "Nuclear", "Wind Turbine"], correct: [2], hint: "Check your fix for Q7." },
        { q: "8. Identify the power plant equipment shown.", type: "single", img: "q8.png", options: ["Coal boiler", "Solar Array", "Nuclear", "Wind Turbine", "Combustion Turbine", "Diesel Generator"], correct: [3], hint: "Check your fix for Q8." },
        { q: "9. Which of the following is an application for DC current?", type: "single", options: ["Florescent Ballast", "Induction Motor", "Transformer", "Automobile Headlamp", "None of the answers listed"], correct: [3], hint: "12V car battery systems." },
        { q: "10. The voltage induced into the armature of a rotating type generator is", type: "single", options: ["AC Voltage", "DC Voltage", "Pulsating DC Voltage"], correct: [0], hint: "Rotation across poles always creates alternating poles." },
        { q: "11. A two pole 50 HZ generator operates at what speed?", type: "single", options: ["1800 RPM", "1500 RPM", "3600 RPM", "3000 RPM"], correct: [3], hint: "N = (120 * f) / P" },
        { q: "12. The most common frequency used in the United States is:", type: "single", options: ["90 Hz", "400 Hz", "60 Hz", "50 Hz"], correct: [2], hint: "US standard utility frequency." },
        { q: "13. What is the line voltage of a 3 phase, Wye connected Generator if the phase voltage is 7.2kV", type: "single", options: ["13.8kV", "13.2KV", "12.47kV", "14.4kV"], correct: [2], hint: "Phase * 1.732." },
        { q: "14. What is the Phase or Line Voltage phase angle order for a three phase system called?", type: "single", options: ["Phase Sequence", "Phase in Time", "Phase Pattern", "Phase Order"], correct: [0], hint: "A-B-C order." },
        { q: "15. How are most three phase generators connected", type: "single", options: ["Grounded Delta", "Delta", "Grounded Wye", "Wye"], correct: [2], hint: "Requires a neutral center point." },
        { q: "16. What is the most common frequency used in Europe?", type: "single", options: ["90 Hz", "200 Hz", "60 Hz", "50 Hz"], correct: [3], hint: "Lower than US frequency." },
        { q: "17. Given a three phase wye connected generator with a phase current of 200A, what is the line current?", type: "single", options: ["200 A", "346 A", "142 A", "115 A"], correct: [0], hint: "In Wye, current stays the same." },
        { q: "18. A generator is based on the principle of _____________.", type: "single", options: ["induction", "sampling", "reduction", "cross coupling"], correct: [0], hint: "Magnetic field + Movement = Electricity." },
        { q: "19. The law that governs the operation of a synchronous generator is", type: "single", options: ["Ohm's Law", "Faraday's Law", "Kirchhoff's Law", "None of the items listed"], correct: [1], hint: "EMF induction." },
        { q: "20. The speed of a generator primarily impacts the __________ of the output voltage.", type: "single", options: ["power", "None of the items listed", "frequency", "current"], correct: [2], hint: "RPM determines Hz." },
        { q: "21. The magnitude of the generator output voltage is dependent on", type: "single", options: ["speed of rotation", "number of stator turns", "All of the answers listed", "strength of the field"], correct: [2], hint: "Voltage depends on speed, turns, and flux." },
        { q: "22. The most common type of generator for large systems, greater than 1MW, is:", type: "single", options: ["Field Rotor, Armature Stator", "Permenant Magnet Stator, Armature Rotor", "Permanent Magnet Rotor, Armatuore Stator", "Field Stator, Armature Rotor"], correct: [0], hint: "Moving field, stationary armature." },
        { q: "23. A high maintenance item on generators is the:", type: "single", options: ["brushes and slip rings", "shaft", "stator winding", "rotor winding"], correct: [0], hint: "Wearing contact parts." },
        { q: "24. A brushless synchronous generator eliminates the", type: "single", options: ["brushes and slip rings", "variable voltage source", "need for synchronous motor excitation", "prime mover"], correct: [0], hint: "The clue is in the name 'brushless'." },
        { q: "25. A hydro-turbine is a low speed generator. What type of rotor field is used?", type: "single", options: ["Salient Pole Rotor", "Round Rotor", "Smooth Rotor", "Rough Rotor"], correct: [0], hint: "Poles stick out." },
        { q: "26. What type of voltage is applied to an electromagnetic rotor?", type: "single", options: ["DC", "Pulsating DC", "Alternating DC", "AC"], correct: [0], hint: "Direct current for constant magnetic field." },
        { q: "27. In a utility power system, the power source is more commonly part of _____________.", type: "single", options: ["Generation", "Transmission", "Distribution", "Utilization"], correct: [0], hint: "Where it all starts." },
        { q: "28. What is the operating voltage level of a transmission system?", type: "single", options: ["Medium Voltage", "Low Voltage", "High Voltage", "Less than 35kV"], correct: [2], hint: "Long distance volts." },
        { q: "29. Which of the following are distribution voltages?", type: "multi", options: ["13.8kV", "13.2kV", "12.47kV", "7.2kV"], correct: [0, 1, 2, 3], hint: "All are commonly used in distribution." },
        { q: "30. A 5MW, three phase, 60Hz, Generator produces 4.7MW of output power. What is the efficiency?", type: "single", options: ["90 %", "92 %", "94 %", "96 %"], correct: [2], hint: "4.7 / 5.0" },
        { q: "31. A steam turbine is designed to run at 1200 RPM and a 3600 RPM generator is to be coupled to the turbine. What is the gear ratio?", type: "single", options: ["0.33", "3.0", "0.50", "1.5"], correct: [0], hint: "1200 / 3600" },
        { q: "32. Given a 9MW, three phase generator with an efficiency of 89%, what is the input power at the shaft of the generator?", type: "single", options: ["8.01 MW", "10.1 MW", "11.2 MW", "9.8 MW"], correct: [1], hint: "9 / 0.89" },
        { q: "33. Given a steam turbine producing 55000-lb-ft of torque. A gearbox with a gear ratio of 0.45 couples the turbine to a generator. How much torque is applied at the generator shaft?", type: "single", options: ["24750 LB-FT", "122222 LB-FT", "55000 LB-FT", "27500 LB-FT"], correct: [0], hint: "55000 * 0.45" },
        { q: "34. Which of the following are crucial matches between the generator output voltage and the utility voltage prior to connecting the generator to the utility bus?", type: "multi", options: ["Phase Angle", "Frequency", "Phase Sequence", "Thevenin Impedance", "Voltage Magnitude"], correct: [0, 1, 2, 4], hint: "All must match except impedance." },
        { q: "35. Given a generator operating in isolation (not paralleled with any other source), what parameter can be adjusted to modify the generator output voltage?", type: "single", options: ["Prime Mover Torque", "Generator Impedance", "Speed of the Generator", "Excitation", "Length of the shaft"], correct: [3], hint: "Adjusting field current." },
        { q: "36. The process of matching voltages in magnitude, phase, frequency, and phase sequence is known as _____________.", type: "single", options: ["conversion", "synchronization", "rectification", "electrification"], correct: [1], hint: "Standard term for paralleling." },
        { q: "37. What action would you take to synchronize the two waveforms?", type: "single", img: "q37.png", options: ["Decrease the generator speed", "Decrease the excitation current", "Increase the generator speed", "Increase the excitation current"], correct: [3], hint: "Check your fix for Q37." },
        { q: "38. What action would you take to synchronize the two waveforms?", type: "multi", img: "q38.png", options: ["Change the generator speed", "Increase the excitation current", "Nothing the waveforms are synchronized", "Decrease the excitation current"], correct: [0, 1], hint: "Check your fix for Q38." },
        { q: "39. The generator output impedance is modeled as a _______________ .", type: "single", options: ["inductive reactance", "conductance", "resistance", "capacitive reactance"], correct: [0], hint: "Winding reactance." },
        { q: "40. Once a generator is tied in parallel with a utility system, the generator load sharing of real power is controlled by varying the ___________ of the generator.", type: "single", options: ["torque", "frequency", "output current", "excitation"], correct: [0], hint: "Pushing harder with the prime mover." },
        { q: "41. Once a generator is paralleled with a utility bus, the reactive power generated or absorbed by the generator is adjusted by changing the _________________.", type: "single", options: ["frequency", "torque", "excitation", "speed"], correct: [2], hint: "Field strength affects VARs." },
        { q: "42. When a generator is operating in parallel with a utility system and reactive power is being supplied to the load, the generator field is ________________.", type: "single", options: ["under-excited", "over-excited", "not excited", "in regulation"], correct: [1], hint: "Supplying means 'Over'." },
        { q: "43. When a generator is operating in parallel with a utility system and reactive power is flowing into the geneartor, the generator field is ________________.", type: "single", options: ["under-excited", "not excited", "over-excited", "in regulation"], correct: [0], hint: "Taking in means 'Under'." },
        { q: "44. When a power system is so vast that a single generator cannot alter the system voltage or frequency, the generator interconnection point is known as a(n) _______.", type: "single", options: ["infinite bus", "finite bus", "power bus", "closed bus"], correct: [0], hint: "Limitless capacity." },
        { q: "45. Given a 250.0 MVA, three phase generator, with a line voltage of 12.47kV. What is the output current?", type: "single", options: ["6.68 kA", "11.58 kA", "12.00 kA", "20.00 kA"], correct: [1], hint: "I = MVA / (V_line * 1.732)" },
        { q: "46. A wye connected three phase generator with a voltage of 12.00 kV has a phase voltage of ______________.", type: "single", options: ["6.93 kV", "12.00 kV", "7.20 kV", "20.78 kV"], correct: [0], hint: "12 / 1.732" }
    ];

    const root = document.getElementById('quiz-root');
    let totalScore = 0;
    let answeredCount = 0;

    quizData.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        
        let content = `<h3>Question ${idx + 1}</h3><p>${item.q}</p>`;
        
        if (item.img) {
            content += `<div class="img-placeholder" id="img-cont-${idx}">
                            <img src="${item.img}" class="q-img" onerror="showError(this, '${item.img}')">
                        </div>`;
        }

        item.options.forEach((opt, optIdx) => {
            const inputType = item.type === "multi" ? "checkbox" : "radio";
            content += `
                <label class="option-label">
                    <input type="${inputType}" name="q${idx}" value="${optIdx}">
                    ${opt}
                </label>
            `;
        });

        content += `<button class="check-btn" onclick="verify(${idx})">Check Answer</button>`;
        content += `<div id="fb-${idx}" class="feedback"></div>`;
        
        // Add Hint Dropdown
        if (item.hint) {
            content += `<details><summary>Hint</summary><p style="color:#666">${item.hint}</p></details>`;
        }
        
        card.innerHTML = content;
        root.appendChild(card);
    });

    window.showError = function(img, name) {
        const container = img.parentElement;
        container.innerHTML = `<strong>📷 Missing: ${name}</strong><br><small>Save screenshot from PDF as '${name}' here.</small>`;
    }

    window.verify = function(idx) {
        const item = quizData[idx];
        const selected = Array.from(document.querySelectorAll(`input[name="q${idx}"]:checked`)).map(el => parseInt(el.value));
        const feedback = document.getElementById(`fb-${idx}`);
        
        const isCorrect = selected.length === item.correct.length && selected.every(val => item.correct.includes(val));

        feedback.style.display = 'block';
        if (isCorrect) {
            feedback.innerHTML = "✅ Correct!";
            feedback.className = "feedback correct";
            totalScore++;
        } else {
            feedback.innerHTML = "❌ Incorrect. Correct answer: " + item.correct.map(c => item.options[c]).join(", ");
            feedback.className = "feedback wrong";
        }
        
        answeredCount++;
        document.getElementById('current-score').innerText = totalScore;
        document.getElementById('progress-fill').style.width = (answeredCount / 46 * 100) + "%";
    }
</script>
</body>
</html>
