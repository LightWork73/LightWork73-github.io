<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World Religion Test 3 | Study Buddy</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --panel-alt: #f7f9fc;
      --panel-border: #e5ebf5;
      --text: #1d2433;
      --muted: #5d677a;
      --primary: #1f4e79;
      --primary-strong: #163b61;
      --primary-soft: #eaf7ee;
      --secondary: #6c757d;
      --success: #7fe394;
      --danger: #9f2733;
      --danger-soft: #fdeceb;
      --shadow: rgba(0,0,0,0.08);
      --button-text: #ffffff;
    }

    body.dark-mode {
      --bg: #121a26;
      --panel: #1a2434;
      --panel-alt: #212f40;
      --panel-border: #2b3d52;
      --text: #e8edf7;
      --muted: #a9b7cf;
      --primary: #7eb8f3;
      --primary-strong: #9fd0ff;
      --primary-soft: rgba(126, 184, 243, 0.14);
      --secondary: #9aa6b2;
      --success: #7ae39d;
      --danger: #ff7f8e;
      --danger-soft: rgba(255, 127, 142, 0.12);
      --shadow: rgba(0,0,0,0.3);
      --button-text: #0b1320;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 900px;
      margin: 0 auto 50px;
      padding: 20px;
      line-height: 1.6;
      transition: background 0.2s ease, color 0.2s ease;
    }

    #top-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 12px;
    }

    .theme-toggle {
      border: 1px solid var(--panel-border);
      background: var(--panel);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 14px;
      font-weight: 600;
      cursor: pointer;
    }

    #score-bar {
      position: sticky;
      top: 0;
      background: linear-gradient(135deg, #1d4f87 0%, #123a5e 100%);
      color: #f8fbff;
      padding: 16px 18px 18px;
      border-radius: 0 0 16px 16px;
      box-shadow: 0 6px 18px rgba(17, 55, 92, 0.25);
      z-index: 10;
    }

    .score-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .score-metrics {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: stretch;
    }

    .metric-box {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      padding: 9px 12px;
      min-width: 120px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .metric-label {
      display: block;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      opacity: 0.9;
    }

    .metric-value {
      display: block;
      font-size: 1.15rem;
      font-weight: 800;
      margin-top: 4px;
    }

    .reset-btn {
      background: rgba(255,255,255,0.18);
      color: var(--button-text);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }

    .celebration-banner {
      position: fixed;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      z-index: 1000;
      width: min(92vw, 420px);
      max-width: 420px;
      padding: 16px 18px 14px;
      background: linear-gradient(135deg, #f4fff7 0%, #e9f9ee 42%, #dff7e7 100%);
      border: 1px solid rgba(118, 200, 140, 0.9);
      color: #1e5a37;
      border-radius: 18px;
      font-weight: 800;
      font-size: 1rem;
      text-align: center;
      box-shadow: 0 16px 30px rgba(35, 125, 74, 0.2), 0 0 0 4px rgba(127, 227, 148, 0.15);
      animation: popIn 0.28s cubic-bezier(.2,.8,.2,1);
    }

    .confetti-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      overflow: hidden;
    }

    .confetti-piece {
      position: absolute;
      top: -14px;
      width: 10px;
      height: 16px;
      border-radius: 4px;
      opacity: 0.95;
      box-shadow: 0 0 10px rgba(255,255,255,0.5);
      animation: confettiFall 1.8s ease-in forwards;
    }

    @keyframes popIn {
      0% { transform: translateX(-50%) scale(0.88); opacity: 0; }
      60% { transform: translateX(-50%) scale(1.04); opacity: 1; }
      100% { transform: translateX(-50%) scale(1); opacity: 1; }
    }

    @keyframes confettiFall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(90vh) rotate(540deg); opacity: 0; }
    }

    .dev-toggle {
      border: 1px solid var(--panel-border);
      background: var(--panel);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 12px;
      font-weight: 700;
      cursor: pointer;
      margin-left: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 118px;
    }

    #dev-center-panel {
      display: none;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 16px 18px;
      margin: 20px 0 18px;
      box-shadow: 0 8px 18px var(--shadow);
    }

    #dev-center-panel.open {
      display: block;
    }

    .sound-panel h3 {
      margin: 0 0 14px;
      font-size: 1.05rem;
    }

    .sound-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    .sound-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-weight: 600;
      color: var(--text);
    }

    .sound-field select {
      width: 100%;
      border: 1px solid var(--panel-border);
      background: var(--panel-alt);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.96rem;
    }

    .sound-preview-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    .sound-preview-btn {
      background: var(--primary);
      color: var(--button-text);
      border: none;
      border-radius: 8px;
      padding: 9px 14px;
      cursor: pointer;
      font-weight: 700;
    }

    #progress-label {
      margin-top: 12px;
      font-size: 0.9rem;
      opacity: 0.98;
      font-weight: 700;
    }

    #progress-container {
      background: rgba(255,255,255,0.18);
      border-radius: 999px;
      height: 14px;
      overflow: hidden;
      margin-top: 8px;
      border: 1px solid rgba(255,255,255,0.18);
    }

    #progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #7eea9a, #baf7c9);
      transition: width 0.3s ease;
      border-radius: 999px;
    }

    .video-resource {
      background: #fff8e1;
      border: 1px solid #f0c36d;
      border-radius: 10px;
      padding: 14px 18px;
      margin: 20px 0;
      color: #1d2433;
    }
    .video-resource a { color: #a05a00; font-weight: 700; }
    body.dark-mode .video-resource {
      background: #212f40 !important;
      border-color: #4b6685 !important;
      color: var(--text) !important;
    }
    body.dark-mode .video-resource a { color: #9fd0ff; }

    .question-card {
      background: var(--panel);
      border-left: 10px solid var(--primary);
      padding: 28px;
      margin: 25px 0;
      border-radius: 14px;
      box-shadow: 0 3px 8px var(--shadow);
    }

    .option-label {
      display: block;
      padding: 12px 14px;
      margin: 10px 0;
      background: var(--panel-alt);
      border: 2px solid var(--panel-border);
      border-radius: 10px;
      cursor: pointer;
    }

    .option-label:hover {
      background: var(--primary-soft);
      border-color: var(--primary);
    }

    .check-btn {
      background: var(--primary);
      color: var(--button-text);
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
    }

    .check-btn:disabled {
      background: #bfc9d7;
      cursor: not-allowed;
    }

    .feedback {
      display: none;
      margin-top: 14px;
      padding: 12px 16px;
      border-radius: 8px;
      font-weight: 600;
    }

    .correct {
      display: block;
      background: var(--primary-soft);
      color: var(--primary-strong);
      border: 1px solid var(--primary);
    }

    .wrong {
      display: block;
      background: var(--danger-soft);
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    details {
      margin-top: 15px;
      background: var(--panel-alt);
      color: var(--text);
      padding: 10px;
      border-radius: 5px;
    }

    summary {
      cursor: pointer;
      font-weight: bold;
      color: var(--primary);
    }

    .formula {
      font-family: "Courier New", Courier, monospace;
      background: #eee;
      padding: 4px 8px;
      border-radius: 4px;
      display: inline-block;
      margin: 5px 0;
      font-weight: bold;
      color: #d63384;
    }

    #results-card {
      display: none;
      background: var(--panel);
      padding: 40px;
      text-align: center;
      border-radius: 15px;
      box-shadow: 0 4px 20px var(--shadow);
      margin: 40px 0;
      border: 2px solid var(--primary);
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }
      #score-bar {
        padding: 12px 12px 14px;
      }
      .score-row {
        align-items: flex-start;
      }
      .score-metrics {
        width: 100%;
        gap: 8px;
      }
      .metric-box {
        flex: 1 1 42%;
        min-width: 0;
      }
      .reset-btn {
        width: 100%;
      }
      .question-card {
        padding: 18px 16px;
      }
    }
  </style>
</head>

  <script>
    let audioCtx = null;
    const soundChoices = {
      correct: 'retro',
      wrong: 'retro',
      finish: 'retro'
    };

    function getAudioContext() {
      const AudioCtor = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtor) return null;
      if (!audioCtx) {
        audioCtx = new AudioCtor();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playTone(frequency, duration, { type = 'sine', volume = 0.06, slideTo = null } = {}) {
      const ctx = getAudioContext();
      if (!ctx) return;

      const oscillator = ctx.createOscillator();
      const gainNode = ctx.createGain();
      oscillator.type = type;
      oscillator.frequency.setValueAtTime(frequency, ctx.currentTime);

      if (slideTo) {
        oscillator.frequency.exponentialRampToValueAtTime(slideTo, ctx.currentTime + duration);
      }

      gainNode.gain.setValueAtTime(0.0001, ctx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(volume, ctx.currentTime + 0.02);
      gainNode.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);

      oscillator.connect(gainNode);
      gainNode.connect(ctx.destination);
      oscillator.start();
      oscillator.stop(ctx.currentTime + duration);
    }

          });

          setTimeout(() => playTone(180, 0.12, { type: 'sine', volume: 0.04, slideTo: 90 }), 70);
        },
        wrong: () => playTone(170, 0.2, { type: 'sawtooth', volume: 0.04, slideTo: 80 }),

        },

        },

        finish: () => {
          const notes = [523.25, 659.25, 783.99, 783.99];
          notes.forEach((note, index) => {
            const duration = index === notes.length - 1 ? 0.3 : 0.2;
            setTimeout(() => playTone(note, duration, { type: 'triangle', volume: 0.05, slideTo: note * 1.05 }), index * 150);
          });

            setTimeout(() => playTone(note, duration, { type: 'triangle', volume: 0.06, slideTo: note * 1.08 }), index * 140);
          });
        }
      }
    };

    function playSelectedSound(kind) {
      const presetName = soundChoices[kind];
      const preset = soundPresets[presetName];
      if (preset && preset[kind]) {
        preset[kind]();
      }
    }

    function playCorrectSound() {
      playSelectedSound('correct');
    }

    function playIncorrectSound() {
      playSelectedSound('wrong');
    }

    function playFinishSound() {
      playSelectedSound('finish');
    }

    function shuffleQuestions(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    let selectedQuestions = [];
    let score = 0;
    let answered = 0;

    function launchConfetti() {
      const confettiLayer = document.getElementById('confetti-layer');
      confettiLayer.innerHTML = '';
      const colors = ['#f9d870', '#7fe394', '#7eb8f3', '#ff8fb1', '#ffd166', '#7cd1ff'];

      for (let i = 0; i < 40; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = `${Math.random() * 100}%`;
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDelay = `${(Math.random() * 0.2).toFixed(2)}s`;
        confettiLayer.appendChild(piece);
      }

      setTimeout(() => {
        confettiLayer.innerHTML = '';
      }, 1800);
    }

    function updateScoreDisplay() {
      const totalQuestions = selectedQuestions.length || 10;
      const accuracy = answered ? Math.round((score / answered) * 100) : 0;
      document.getElementById('current-score').textContent = score;
      document.getElementById('total-q-count').textContent = totalQuestions;
      document.getElementById('answered-count').textContent = answered;
      document.getElementById('answered-total').textContent = totalQuestions;
      document.getElementById('score-percent').textContent = accuracy;
      document.getElementById('progress-fill').style.width = `${(answered / totalQuestions) * 100}%`;

      const celebration = document.getElementById('celebration-banner');
      if (answered === totalQuestions) {
        const allDone = score >= Math.ceil(totalQuestions * 0.7);
        celebration.style.display = allDone ? 'block' : 'none';
        if (allDone) {
          celebration.textContent = `🎉 Nice work! You scored ${score}/${totalQuestions}.`;
          launchConfetti();
          playFinishSound();
        }
      } else {
        celebration.style.display = 'none';
      }
    }

    function renderQuiz() {
      const root = document.getElementById('quiz-root');
      root.innerHTML = '';
      document.getElementById('celebration-banner').style.display = 'none';
      document.getElementById('confetti-layer').innerHTML = '';
      selectedQuestions = shuffleQuestions(quizData).slice(0, 10);
      score = 0;
      answered = 0;
      updateScoreDisplay();

      selectedQuestions.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        let html = `<h3>Question ${idx + 1}</h3><p>${item.q}</p>`;
        if (item.video) {
          html += `<div class="video-resource" style="background:#fff8e1; border:1px solid #f0c36d; border-radius:10px; padding:14px 18px; margin:16px 0; color:#1d2433;"><a href="https://youtu.be/X3EUy1P3rwc?si=YTdAQ8gKNhldgifS" target="_blank" rel="noopener">Review the Buddhism video</a></div>`;
        }

        item.options.forEach((opt, optIndex) => {
          html += `
            <label class="option-label">
              <input type="${item.type === 'multi' ? 'checkbox' : 'radio'}" name="q${idx}" value="${optIndex}">
              ${opt}
            </label>
          `;
        });

        html += `<button class="check-btn" onclick="checkAnswer(${idx})">Check Answer</button>`;
        html += `<div id="fb-${idx}" class="feedback"></div>`;
        if (item.hint) {
          html += `<details><summary>Hint</summary><p>${item.hint}</p></details>`;
        }

        card.innerHTML = html;
        root.appendChild(card);
      });

      document.getElementById('results-card').style.display = 'none';
    }

    function checkAnswer(idx) {
      const item = selectedQuestions[idx];
      const selected = Array.from(document.querySelectorAll(`input[name="q${idx}"]:checked`)).map((el) => Number(el.value));
      if (!selected.length) {
        alert('Please choose an answer before checking.');
        return;
      }

      const isCorrect = selected.length === item.correct.length && selected.every((value) => item.correct.includes(value));
      const fb = document.getElementById(`fb-${idx}`);
      fb.className = isCorrect ? 'feedback correct' : 'feedback wrong';
      fb.textContent = isCorrect
        ? '✅ Correct!'
        : `❌ Incorrect. Correct answer: ${item.correct.map((i) => item.options[i]).join(' & ')}`;

      document.querySelectorAll(`input[name="q${idx}"]`).forEach((el) => el.disabled = true);
      const button = document.querySelectorAll('.check-btn')[idx];
      if (button) button.disabled = true;

      if (isCorrect) {
        score += 1;
      }
      answered += 1;
      updateScoreDisplay();

      if (isCorrect) {
        playCorrectSound();
      } else {
        playIncorrectSound();
      }

      if (answered === selectedQuestions.length) {
        const percentage = Math.round((score / selectedQuestions.length) * 100);
        const resultText = document.getElementById('result-text');
        const resultComment = document.getElementById('result-comment');
        const resultsCard = document.getElementById('results-card');
        resultsCard.style.display = 'block';
        resultText.textContent = `Final Score: ${score} / ${selectedQuestions.length} (${percentage}%)`;
        resultComment.textContent = percentage >= 70
          ? 'Great work. You are covering the main ideas well.'
          : 'Good start—review the missed items and try again.';
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      }
    }

    function toggleTheme() {
      const body = document.body;
      const darkMode = body.classList.toggle('dark-mode');
      document.querySelector('.theme-toggle').textContent = darkMode ? '☀️ Light mode' : '🌙 Dark mode';
      localStorage.setItem('theme', darkMode ? 'dark' : 'light');
    }

    function resetQuiz() {
      renderQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    const soundSelects = {
      correct: document.getElementById('sound-correct-select'),
      wrong: document.getElementById('sound-wrong-select'),
      finish: document.getElementById('sound-finish-select')
    };

    Object.entries(soundSelects).forEach(([kind, selectEl]) => {
      selectEl.addEventListener('change', (event) => {
        soundChoices[kind] = event.target.value;
      });
    });

    document.querySelectorAll('.sound-preview-btn').forEach((button) => {
      button.addEventListener('click', () => {
        playSelectedSound(button.dataset.sound);
      });
    });

    const devCenterToggle = document.getElementById('dev-center-toggle');
    const devCenterPanel = document.getElementById('dev-center-panel');

    devCenterToggle.addEventListener('click', () => {
      const isOpen = devCenterPanel.classList.toggle('open');
      devCenterToggle.setAttribute('aria-expanded', String(isOpen));
      devCenterToggle.title = isOpen ? 'Close developer sound center' : 'Open developer sound center';
      devCenterToggle.textContent = isOpen ? '⚙️ Dev Center' : '⚙️ Dev Center';
    });

    window.addEventListener('load', () => {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark') {
        document.body.classList.add('dark-mode');
        document.querySelector('.theme-toggle').textContent = '☀️ Light mode';
      }
      renderQuiz();
    });
  </script>
