    let testSet = [];
    let score = 0;
    let answered = 0;

    window.initializeQuiz = function() {
        const selected = Array.from(document.querySelectorAll('#setup-screen input:checked')).map(i => i.value);
        if (selected.length === 0) return alert("Select at least one quiz pool!");

        testSet = [];
        selected.forEach(pid => {
            const pool = allPools[pid];
            const shuffled = [...pool].sort(() => 0.5 - Math.random());
            // Pull 10 random questions from each selected pool
            const picked = shuffled.slice(0, 10).map(q => ({...q, originPool: pid}));
            testSet = testSet.concat(picked);
        });

        // Shuffle the combined set
        testSet.sort(() => 0.5 - Math.random());
        
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('quiz-container').style.display = 'block';
        document.getElementById('total-q-count').innerText = testSet.length;
        renderQuestions();
    }

    function renderQuestions() {
        const root = document.getElementById('quiz-root');
        root.innerHTML = '';
        testSet.forEach((item, idx) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            
            card.innerHTML = `
                <h3>Question ${idx + 1} <span class="debug-info">| Quiz ${item.originPool}, Q# ${item.id}</span></h3>
                <p>${item.q}</p>
                ${item.img ? `<div class="img-placeholder"><img src="${item.img}" class="q-img" onerror="this.parentElement.innerHTML='[Image Reference: ${item.img}]'"></div>` : ''}
                <div id="opts-${idx}"></div>
                <button class="check-btn" id="btn-${idx}" onclick="check(${idx})">Check Answer</button>
                <div id="fb-${idx}" class="feedback"></div>
                ${item.hint ? `<details><summary>Get a Hint</summary><p>${item.hint}</p></details>` : ''}
            `;
            
            const optCont = card.querySelector(`#opts-${idx}`);
            item.options.forEach((opt, oIdx) => {
                optCont.innerHTML += `
                    <label class="option-label">
                        <input type="${item.type === 'multi' ? 'checkbox' : 'radio'}" name="q${idx}" value="${oIdx}"> ${opt}
                    </label>
                `;
            });
            root.appendChild(card);
        });
    }

    window.check = function(idx) {
        const item = testSet[idx];
        const selected = Array.from(document.querySelectorAll(`input[name="q${idx}"]:checked`)).map(e => parseInt(e.value));
        if (!selected.length) return;

        const isCorrect = selected.length === item.correct.length && selected.every(v => item.correct.includes(v));
        const fb = document.getElementById(`fb-${idx}`);
        fb.style.display = 'block';
        
        if (isCorrect) {
            fb.innerHTML = "✅ Correct!";
            fb.className = "feedback correct";
            score++;
        } else {
            fb.innerHTML = "❌ Incorrect. Correct Answer: " + item.correct.map(c => item.options[c]).join(", ");
            fb.className = "feedback wrong";
        }

        document.getElementById(`btn-${idx}`).disabled = true;
        // Disable inputs
        document.querySelectorAll(`input[name="q${idx}"]`).forEach(el => el.disabled = true);
        
        answered++;
        document.getElementById('current-score').innerText = score;
        document.getElementById('progress-fill').style.width = (answered / testSet.length * 100) + "%";

        if (answered === testSet.length) {
            document.getElementById('results-card').style.display = 'block';
            document.getElementById('result-text').innerText = `Final Result: ${score} / ${testSet.length} (${Math.round(score/testSet.length*100)}%)`;
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }
    }
</script>
